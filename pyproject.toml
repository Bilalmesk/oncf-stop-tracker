[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oncf-stop-tracker"
version = "0.1.0"
description = "Scheduled arrival, departure and stop duration for ONCF trains in Morocco"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["requests>=2.31", "truststore>=0.10", "tzdata>=2026.6"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
oncf = "oncf.cli:main"

[tool.setuptools.packages.find]
include = ["oncf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
